<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Dashboard — LocalService</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">🔧 LocalService</a>
    <nav>
      <a href="services.html">Browse Services</a>
      <a href="emergency.html">Emergency</a>
      <a href="#" onclick="logout();return false;">Logout</a>
    </nav>
    <span class="user-info" id="who"></span>
  </header>
  <main class="container">
    <h2 style="margin-bottom:1rem">My Dashboard</h2>
    <div class="actions" style="margin-bottom:1rem">
      <a class="btn" href="services.html">Book a Service</a>
      <a class="btn btn-danger" href="emergency.html">🚨 Emergency</a>
    </div>
    <div id="alert" class="hidden"></div>
    <div class="card">
      <h3>Booking History</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Service</th><th>Provider</th><th>Date</th><th>Time</th>
              <th>Status</th><th>Price</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script>
    const user = requireAuth(['CUSTOMER']);
    if (!user) throw new Error('auth');
    document.getElementById('who').textContent = user.name;

    async function load() {
      const data = await api('/api/bookings/customer/' + user.id);
      const rows = document.getElementById('rows');
      if (!data.success) {
        showAlert(document.getElementById('alert'), data.message, 'error');
        return;
      }
      rows.innerHTML = (data.bookings || []).map(b => `
        <tr>
          <td>#${b.id} ${b.emergency ? '<span class="badge badge-emergency">SOS</span>' : ''}</td>
          <td>${b.serviceName}</td>
          <td>${b.providerName}</td>
          <td>${b.bookingDate}</td>
          <td>${b.bookingTime}</td>
          <td><span class="badge ${badgeClass(b.status)}">${b.status}</span></td>
          <td>${formatMoney(b.servicePrice)}</td>
          <td class="actions">
            ${['PENDING','CONFIRMED'].includes(b.status)
              ? `<button class="btn btn-sm btn-danger" onclick="cancelBooking(${b.id})">Cancel</button>
                 <a class="btn btn-sm btn-success" href="payment.html?bookingId=${b.id}">Pay</a>`
              : '—'}
          </td>
        </tr>`).join('') || '<tr><td colspan="8">No bookings yet.</td></tr>';
    }

    async function cancelBooking(id) {
      if (!confirm('Cancel this booking?')) return;
      const data = await api('/api/bookings/cancel', {
        method: 'POST',
        body: JSON.stringify({ bookingId: id, customerId: user.id })
      });
      if (!data.success) alert(data.message);
      else load();
    }

    load();
  </script>
</body>
</html>
